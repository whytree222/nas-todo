name: Build native test apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  backend:
    name: Python backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish cloud run link
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'pending', context: 'nas-todo/backend',
              description: 'Backend checks started; open cloud build',
              target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend HTTP and SQLite tests
        run: python -B -m unittest discover -s server/tests -v
      - name: Release manifest tests
        run: python -B -m unittest discover -s scripts/tests -v
      - name: Report backend result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: passed ? 'success' : 'failure', context: 'nas-todo/backend',
              description: passed ? 'Backend checks passed; client builds run separately' : 'Backend checks failed',
              target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });

  android:
    name: Android release APK
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.NAS_TODO_KEYSTORE_BASE64 != '' }}
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Tool versions
        run: flutter --version
      - name: Dependencies
        run: flutter pub get
      - name: Gradle wrapper permissions
        run: chmod +x android/gradlew
      - name: Static analysis
        run: flutter analyze
      - name: Install Chinese font for visual previews
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Tests
        env:
          NAS_TODO_TEST_TMP: ${{ runner.temp }}/nas-todo-sync-tests
        run: flutter test
      - name: Record celebration visual previews
        env:
          NAS_TODO_TEST_TMP: ${{ runner.temp }}/nas-todo-sync-tests
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          for name in ('celebration-mobile.png', 'celebration-desktop.png'):
              path = Path(os.environ['NAS_TODO_TEST_TMP']) / name
              if not path.is_file():
                  raise RuntimeError(f'Missing celebration preview: {name}')
              print('CELEBRATION_PREVIEW_PNG ' + name + ' ' + base64.b64encode(path.read_bytes()).decode('ascii'))
          PY
      - name: Save celebration visual previews
        uses: actions/upload-artifact@v4
        with:
          name: celebration-visual-previews
          path: ${{ runner.temp }}/nas-todo-sync-tests/celebration-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Record workbench visual previews
        env:
          NAS_TODO_TEST_TMP: ${{ runner.temp }}/nas-todo-sync-tests
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          for name in ('workbench-desktop.png', 'workbench-phone.png', 'workbench-board.png', 'workbench-matrix.png', 'workbench-habits.png', 'workbench-calendar.png', 'workbench-editor-desktop.png', 'workbench-editor-phone.png', 'workbench-achievements-desktop.png', 'workbench-achievements-phone.png', 'workbench-weekly-desktop.png', 'workbench-weekly-phone.png'):
              path = Path(os.environ['NAS_TODO_TEST_TMP']) / name
              if not path.is_file():
                  raise RuntimeError(f'Missing workbench preview: {name}')
              print('WORKBENCH_PREVIEW_PNG ' + name + ' ' + base64.b64encode(path.read_bytes()).decode('ascii'))
          PY
      - name: Save workbench visual previews
        uses: actions/upload-artifact@v4
        with:
          name: workbench-visual-previews
          path: ${{ runner.temp }}/nas-todo-sync-tests/workbench-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Build debug APK for testing
        # Update UI previews contain synthetic release metadata only.
        run: flutter build apk --debug
      - name: Record update UI previews
        env:
          NAS_TODO_TEST_TMP: ${{ runner.temp }}/nas-todo-sync-tests
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          for name in ('update-phone.png', 'update-windows.png'):
              path = Path(os.environ['NAS_TODO_TEST_TMP']) / name
              if not path.is_file():
                  raise RuntimeError(f'Missing update preview: {name}')
              print('UPDATE_PREVIEW_PNG ' + name + ' ' + base64.b64encode(path.read_bytes()).decode('ascii'))
          PY
      - name: Save update UI previews
        uses: actions/upload-artifact@v4
        with:
          name: update-visual-previews
          path: ${{ runner.temp }}/nas-todo-sync-tests/update-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Prepare fixed signing key
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          NAS_TODO_KEYSTORE_BASE64: ${{ secrets.NAS_TODO_KEYSTORE_BASE64 }}
        run: |
          python - <<'PYKEY'
          import base64, os
          from pathlib import Path
          key = Path(os.environ['RUNNER_TEMP']) / 'nas-todo-release.p12'
          key.write_bytes(base64.b64decode(os.environ['NAS_TODO_KEYSTORE_BASE64'], validate=True))
          key.chmod(0o600)
          PYKEY
      - name: Build fixed-signature release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          NAS_TODO_KEYSTORE_PATH: ${{ runner.temp }}/nas-todo-release.p12
          NAS_TODO_STORE_PASSWORD: ${{ secrets.NAS_TODO_STORE_PASSWORD }}
          NAS_TODO_KEY_ALIAS: ${{ secrets.NAS_TODO_KEY_ALIAS }}
          NAS_TODO_KEY_PASSWORD: ${{ secrets.NAS_TODO_KEY_PASSWORD }}
        run: flutter build apk --release
      - name: Validate release compilation without signing
        if: env.HAS_RELEASE_SIGNING != 'true'
        run: flutter build apk --release
      - name: Verify fixed-signature release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        run: python ../scripts/verify_android_release.py --apk build/app/outputs/flutter-apk/app-release.apk --sdk "$ANDROID_HOME"
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native scrollable widgets on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: client/android
          script: ./gradlew connectedDebugAndroidTest --no-daemon
      - name: Save Android widget test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-widget-native-test-reports
          path: |
            client/build/app/reports/androidTests/
            client/build/app/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: env.HAS_RELEASE_SIGNING == 'true'
        with:
          name: nas-todo-android-release-apk
          path: |
            client/build/app/outputs/flutter-apk/app-release.apk
            client/build/app/outputs/flutter-apk/app-release.identity.json
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows full program directory
    needs: backend
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Tool versions
        run: flutter --version
      - name: Dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Tests
        env:
          NAS_TODO_TEST_TMP: ${{ runner.temp }}/nas-todo-sync-tests
        run: flutter test
      - name: Build Windows release
        run: flutter build windows --release
      - name: Verify Windows build identity
        run: python ../scripts/verify_windows_release.py --exe build/windows/x64/runner/Release/nas_todo.exe
      - name: Test transactional Windows updater
        run: |
          $helperTest = Join-Path $env:RUNNER_TEMP 'nas-todo-updater-self-test.exe'
          Copy-Item -LiteralPath "$PWD/build/windows/x64/runner/Release/nas_todo_updater.exe" -Destination $helperTest
          $updateTest = Start-Process -FilePath $helperTest -WorkingDirectory $env:RUNNER_TEMP -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
          if ($updateTest.ExitCode -ne 0) { throw "Windows updater validation failed: $($updateTest.ExitCode)" }
          Write-Output 'Windows updater checks passed: SHA256, safe paths, locked-file rollback and unrelated-file preservation'
      - name: Test native glass desktop widget
        run: |
          $widgetTest = Start-Process -FilePath "$PWD/build/windows/x64/runner/Release/nas_todo.exe" -ArgumentList '--widget-self-test' -Wait -PassThru -WindowStyle Hidden
          if ($widgetTest.ExitCode -ne 0) { throw "Native widget checks failed: $($widgetTest.ExitCode)" }
          Write-Output 'Native widget checks passed: composed glass, independent window, completion, four edges and hover reveal'
      - name: Include standalone widget launcher
        run: Copy-Item -LiteralPath windows/desktop-widget.cmd -Destination build/windows/x64/runner/Release/desktop-widget.cmd
      - name: Test main interface and independent widget lifetime
        timeout-minutes: 2
        run: |
          $hostTest = Start-Process -FilePath "$PWD/build/windows/x64/runner/Release/nas_todo.exe" -ArgumentList '--widget-host-self-test' -PassThru -WindowStyle Hidden
          if (-not $hostTest.WaitForExit(60000)) { Stop-Process -Id $hostTest.Id; throw 'Desktop widget host test timed out' }
          if ($hostTest.ExitCode -ne 0) { throw "Desktop widget host test failed: $($hostTest.ExitCode)" }
          Write-Output 'Main close hides interface while widget stays visible; reopening and component close preserve main interface'
      - uses: actions/upload-artifact@v4
        with:
          name: nas-todo-windows-full-release
          path: client/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
