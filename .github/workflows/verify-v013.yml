name: Verify v0.13.0 public update downloads

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-v013.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read published release metadata
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const {data: release} = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo, tag: 'v0.13.0'
            });
            fs.mkdirSync('work', {recursive: true});
            fs.writeFileSync('work/v013-public-release-api.json', JSON.stringify(release));
      - name: Download and verify both update channels and all release assets
        run: |
          python - <<'PY'
          """Read-only verification of the published NAS Todo release and latest channel."""
          from pathlib import Path
          import hashlib
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          import zipfile
          
          ROOT = Path('work').resolve()
          DEST = ROOT / 'v013-published'
          BASE = 'https://github.com/whytree222/nas-todo/releases/'
          VERSION = '0.13.0'
          
          class Redirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  parts = urllib.parse.urlsplit(newurl)
                  assert parts.scheme == 'https' and not parts.username and not parts.password
                  assert parts.port in (None, 443)
                  assert parts.hostname in {'github.com', 'release-assets.githubusercontent.com', 'objects.githubusercontent.com'}
                  if parts.hostname == 'github.com':
                      assert parts.path.startswith('/whytree222/nas-todo/releases/download/v0.13.0/')
                  count = getattr(req, '_nas_redirects', 0) + 1
                  assert count <= 5
                  target = super().redirect_request(req, fp, code, msg, headers, newurl)
                  target._nas_redirects = count
                  return target
          
          opener = urllib.request.build_opener(Redirects())
          
          def download(url, target, maximum):
              assert url.startswith(BASE)
              request = urllib.request.Request(url, headers={'User-Agent': 'NAS-Todo-ReleaseVerifier', 'Accept-Encoding': 'identity'})
              digest = hashlib.sha256()
              size = 0
              started = time.monotonic()
              print('Checking ' + target.name, flush=True)
              with opener.open(request, timeout=40) as response, target.open('wb') as output:
                  assert response.status == 200
                  for chunk in iter(lambda: response.read1(65536), b''):
                      assert time.monotonic() - started < 180, 'Download deadline exceeded: ' + target.name
                      size += len(chunk)
                      assert size <= maximum
                      digest.update(chunk)
                      output.write(chunk)
              return size, 'sha256:' + digest.hexdigest()
          
          def main():
              release = json.loads((ROOT / 'v013-public-release-api.json').read_text('utf-8'))
              assert release['tag_name'] == 'v' + VERSION and not release['draft'] and not release['prerelease']
              assets = {entry['name']: entry for entry in release['assets']}
              expected = {'nas-todo-android-v0.13.0.apk', 'nas-todo-windows-v0.13.0-x64.zip',
                          'nas-todo-server-v0.13.0.zip', 'INSTALL.md', 'SHA256SUMS.txt', 'update.json', 'update-windows.json'}
              assert set(assets) == expected
              DEST.mkdir(exist_ok=True)
              manifests = {}
              verified = []
              for platform, filename in [('android', 'update.json'), ('windows', 'update-windows.json')]:
                  url = BASE + 'latest/download/' + filename + '?t=' + str(int(time.time() * 1000))
                  actual = download(url, DEST / filename, 65536)
                  assert actual == (assets[filename]['size'], assets[filename]['digest'])
                  manifest = json.loads((DEST / filename).read_text('utf-8'))
                  assert manifest['schema'] == 1 and manifest['versionName'] == VERSION and manifest['versionCode'] == 17
                  assert manifest['minSupportedVersionCode'] == 17
                  assert manifest['pageUrl'] == BASE + 'tag/v' + VERSION
                  package_name = 'nas-todo-android-v0.13.0.apk' if platform == 'android' else 'nas-todo-windows-v0.13.0-x64.zip'
                  assert manifest['apkUrls' if platform == 'android' else 'zipUrls'] == [assets[package_name]['browser_download_url']]
                  assert manifest['size'] == assets[package_name]['size'] and 'sha256:' + manifest['sha256'] == assets[package_name]['digest']
                  manifests[platform] = manifest
                  verified.append(filename)
              for name, asset in assets.items():
                  assert re.fullmatch(r'[A-Za-z0-9_.-]+', name)
                  assert asset['browser_download_url'] == BASE + 'download/v' + VERSION + '/' + name
                  if name not in verified:
                      cached = DEST / name
                      actual = None
                      if cached.is_file() and cached.stat().st_size == asset['size']:
                          with cached.open('rb') as source:
                              actual = (cached.stat().st_size, 'sha256:' + hashlib.file_digest(source, 'sha256').hexdigest())
                      if actual != (asset['size'], asset['digest']):
                          actual = download(asset['browser_download_url'], cached, 100 * 1024 * 1024)
                      assert actual == (asset['size'], asset['digest']), name
                      verified.append(name)
              sums = dict(line.split('  ', 1)[::-1] for line in (DEST / 'SHA256SUMS.txt').read_text('utf-8').splitlines())
              assert set(sums) == expected - {'SHA256SUMS.txt'}
              for name, digest in sums.items():
                  assert assets[name]['digest'] == 'sha256:' + digest
              for name in ['nas-todo-android-v0.13.0.apk', 'nas-todo-windows-v0.13.0-x64.zip', 'nas-todo-server-v0.13.0.zip']:
                  with zipfile.ZipFile(DEST / name) as archive:
                      assert archive.testzip() is None
                      if name.startswith('nas-todo-windows'):
                          names = archive.namelist()
                          assert {'nas_todo.exe', 'nas_todo_updater.exe', 'flutter_windows.dll', 'data/icudtl.dat', 'desktop-widget.cmd'} <= set(names)
                          assert all(n.startswith('data/') or re.fullmatch(r'[A-Za-z0-9_.-]+\.(exe|dll|cmd)', n, re.I) for n in names)
                          assert not any(n.endswith('.pdb') or n.endswith('.identity.json') for n in names)
              proof = {'release': release['html_url'], 'tag': release['tag_name'], 'latest_manifests_verified': True,
                       'actual_asset_bytes_verified': sorted(verified), 'manifests': manifests,
                       'assets': [{k: a[k] for k in ('name', 'size', 'digest', 'browser_download_url')} for a in assets.values()]}
              (ROOT / 'release-v013-proof.json').write_text(json.dumps(proof, ensure_ascii=False, indent=2) + '\n', 'utf-8')
              print('Verified both latest update manifests, all seven asset byte hashes, checksum list and install archives.')
          
          if __name__ == '__main__':
              main()
          
          from pathlib import Path
          print('RELEASE_DOWNLOAD_VERIFIED ' + Path('work/release-v013-proof.json').read_text('utf-8').replace('\n', ''))
          PY
