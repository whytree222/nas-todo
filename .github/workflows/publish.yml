name: Publish v0.1.0 private test release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']

permissions:
  contents: write
  actions: read
  statuses: write

concurrency:
  group: publish-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Report release run
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'pending', context: 'nas-todo/release',
              description: 'Preparing private v0.1.0 test release',
              target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download tested Android APK
        uses: actions/download-artifact@v4
        with:
          name: nas-todo-android-test-apk
          path: release-input/android
          run-id: 37900998859
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download tested Windows program
        uses: actions/download-artifact@v4
        with:
          name: nas-todo-windows-full-release
          path: release-input/windows
          run-id: 37900998859
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify packages and publish private prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/publish_release.py
      - name: Report release result
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: passed ? 'success' : 'failure', context: 'nas-todo/release',
              description: passed ? 'Private v0.1.0 test release published' : 'Private release publication failed',
              target_url: passed
                ? '${{ github.server_url }}/${{ github.repository }}/releases/tag/v0.1.0'
                : '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });
