name: nas_todo
description: Private offline-first todo app for Android and Windows, synced to your NAS.
publish_to: none
version: 0.13.0+17

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: 3.0.6
  archive: 4.5.2
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.2.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
